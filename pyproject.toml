[project]
name = "enterprise-agent"
version = "0.0.1"
description = "Enterprise AI Operations Agent - Stage 0 scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "openai>=1.40",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

# Optional durable/LangGraph deps (offline CI must stay green — do NOT make hard requirements):
# "langgraph>=0.2",
# "langgraph-checkpoint-postgres>=2.0",
# "psycopg[binary]>=3.1",
# "redis>=5.0",

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "agent*", "knowledge*", "security*", "workflow*", "observability*", "evaluation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
